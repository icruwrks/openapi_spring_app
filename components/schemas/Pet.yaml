Pet:
  required:
    - name
    - photoUrls
  type: object
  properties:
    id:
      type: integer
      format: int64
      example: 10
      minimum: 1
      maximum: 100000
    name:
      type: string
      example: doggie
      minLength: 1
      maxLength: 100
    category:
      $ref: '../schemas/Category.yaml#/Category'
    photoUrls:
      type: array
      xml:
        wrapped: true
      items:
        type: string
        xml:
          name: photoUrl
    tags:
      type: array
      xml:
        wrapped: true
      items:
        $ref: '../schemas/Tag.yaml#/Tag'
    status:
      type: string
      description: pet status in the store
      enum:
        - available
        - pending
        - sold
  xml:
    name: pet